<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f4f7fb;
    --ink: #0b0f19;
    --dim: #4b5563;
    --cyan: #00c9a7;
    --pink: #ff4d8d;
    --purple: #a855f7;
    --grid: rgba(0, 201, 167, 0.12);
    --panel: rgba(255, 255, 255, 0.82);
    --border: rgba(0, 201, 167, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #05070d;
      --ink: #eef4fc;
      --dim: #9ca3af;
      --cyan: #00ffcc;
      --pink: #ff6b9d;
      --purple: #c084fc;
      --grid: rgba(0, 255, 204, 0.08);
      --panel: rgba(17, 24, 39, 0.72);
      --border: rgba(0, 255, 204, 0.28);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1400px; height: 420px;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
    overflow: hidden; position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(circle at 72% 50%, black 10%, transparent 72%);
  }
  .glow {
    position: absolute; width: 520px; height: 520px; border-radius: 50%;
    right: -80px; top: -60px;
    background: radial-gradient(circle, rgba(0,255,204,.18), transparent 68%);
    filter: blur(8px);
  }
  .wrap {
    position: relative; z-index: 1;
    height: 100%; padding: 54px 64px;
    display: flex; align-items: center; justify-content: space-between; gap: 40px;
  }
  .badge {
    display: inline-block;
    font-size: 13px; font-weight: 800; letter-spacing: 2px;
    color: var(--cyan); border: 1px solid var(--border);
    background: var(--panel); padding: 6px 14px; border-radius: 999px;
  }
  h1 {
    margin-top: 18px;
    font-size: 72px; font-weight: 900; line-height: 1.02; letter-spacing: 1px;
  }
  h1 .grad {
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub {
    margin-top: 16px; font-size: 28px; font-weight: 700; color: var(--ink);
  }
  .desc {
    margin-top: 12px; font-size: 17px; color: var(--dim); max-width: 720px; line-height: 1.55;
  }
  .meta {
    margin-top: 28px; display: flex; flex-wrap: wrap; gap: 14px;
  }
  .chip {
    font-size: 15px; font-weight: 700; color: var(--ink);
    background: var(--panel); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 10px;
  }
  .scene {
    flex: 0 0 430px; height: 300px; position: relative;
  }
  .maze {
    position: absolute; inset: 0;
    border: 2px solid var(--border); border-radius: 18px;
    background: var(--panel);
    box-shadow: 0 0 40px rgba(0,255,204,.12);
    overflow: hidden;
  }
  .maze-grid {
    position: absolute; inset: 18px;
    display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(7, 1fr);
    gap: 6px;
  }
  .cell { border-radius: 4px; background: rgba(0,255,204,.06); border: 1px solid rgba(0,255,204,.08); }
  .cell.wall { background: rgba(0,255,204,.22); border-color: rgba(0,255,204,.35); }
  .cell.neon {
    grid-column: 4 / span 4; grid-row: 3 / span 2;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; letter-spacing: 1px; text-align: center; line-height: 1.35;
    color: var(--cyan); text-shadow: 0 0 10px rgba(0,255,204,.55);
    background: rgba(0,255,204,.08); border-color: rgba(0,255,204,.45);
  }
  .pac {
    position: absolute; left: 58px; bottom: 42px; width: 34px; height: 34px;
    border-radius: 50%; background: #ffd34d;
    clip-path: polygon(50% 50%, 100% 6%, 100% 94%);
    box-shadow: 0 0 18px rgba(255,211,77,.55);
  }
  .ghost {
    position: absolute; width: 28px; height: 28px; border-radius: 14px 14px 6px 6px;
  }
  .ghost.r { right: 72px; top: 54px; background: #ff5b6e; box-shadow: 0 0 16px rgba(255,91,110,.45); }
  .ghost.p { right: 118px; top: 88px; background: #ff9fd6; box-shadow: 0 0 16px rgba(255,159,214,.45); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="wrap">
    <div>
      <span class="badge">TYPESAFE JEV · SYSTEM ONE</span>
      <h1><span class="grad">Jev</span> 模型游乐场</h1>
      <p class="sub">小白也能马上掌握</p>
      <p class="desc">吃豆人 AI 决策实测 · 内容审核 · 简历筛选 · 简繁切换 · 解压双击即用</p>
      <div class="meta">
        <span class="chip">👾 吃豆人三模式</span>
        <span class="chip">🛡️ 结构化判断</span>
        <span class="chip">🌐 默认繁体</span>
        <span class="chip">📦 不用装 Python</span>
      </div>
    </div>
    <div class="scene">
      <div class="maze">
        <div class="maze-grid">
          <div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div>
          <div class="cell wall"></div><div class="cell"></div><div class="cell"></div><div class="cell wall"></div><div class="cell"></div><div class="cell"></div><div class="cell wall"></div><div class="cell"></div><div class="cell"></div><div class="cell wall"></div>
          <div class="cell wall"></div><div class="cell"></div><div class="cell wall"></div><div class="cell neon">靜電的<br>AI研習社</div><div class="cell wall"></div><div class="cell"></div><div class="cell wall"></div>
          <div class="cell wall"></div><div class="cell"></div><div class="cell"></div><div class="cell wall"></div><div class="cell"></div><div class="cell"></div><div class="cell wall"></div><div class="cell"></div><div class="cell"></div><div class="cell wall"></div>
          <div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div><div class="cell wall"></div>
        </div>
        <div class="pac"></div>
        <div class="ghost r"></div>
        <div class="ghost p"></div>
      </div>
    </div>
  </div>
</body>
</html>
