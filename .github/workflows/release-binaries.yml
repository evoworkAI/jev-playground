name: Build release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 上传到哪个 Release
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build
        run: python packaging/build.py
        env:
          PYTHONUTF8: "1"

      - name: Zip
        run: python packaging/zip_release.py
        env:
          PYTHONUTF8: "1"

      - name: Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          for f in Jev-Playground-Mac.zip Jev-Playground-Windows.zip; do
            if [ -f "$f" ]; then
              gh release upload "$tag" "$f" --clobber
            fi
          done
